id: fs-no-sensitive-leak
name: Block Access to Sensitive System Files
severity: critical
action: block
description: Prevents AI agents from accessing SSH credentials, AWS configs, environment secrets, or system auth files.

match:
  tools: ["*file*", "*read*", "*fs*", "*path*", "*cat*"]
  arg_regex:
    - "(?i)(/|\\\\)\\.ssh(/|\\\\|$)"
    - "(?i)(/|\\\\)\\.aws(/|\\\\|$)"
    - "(?i)(\\.env(\\.[a-z0-9_-]+)?)$"
    - "(?i)/etc/(passwd|shadow)"

tests:
  should_block:
    - tool: read_file
      args: { path: "/home/user/.ssh/id_rsa" }
    - tool: fs_read
      args: { file_path: "C:\\Users\\admin\\.aws\\credentials" }
    - tool: read_file
      args: { path: "../../.env" }
    - tool: read_file
      args: { path: "/etc/passwd" }
  should_allow:
    - tool: read_file
      args: { path: "./src/main.rs" }
    - tool: fs_read
      args: { file_path: "README.md" }
