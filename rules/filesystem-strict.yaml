id: filesystem-strict-secrets
name: Block Sensitive Credential Files & Deep Path Traversal
severity: critical
action: block
description: Stops filesystem MCP tools from reading dotenv secrets, cloud/SSH keys, package auth tokens, or traversing out of the workspace.

match:
  tools: ["*file*", "*fs*", "*read*", "*write*", "*edit*", "*cat*", "*dir*", "*path*"]
  arg_regex:
    - '(?i)(^|[/\\])\.env(\.[a-z0-9_-]+)?(\s|$)'
    - '(?i)(^|[/\\])(\.ssh|\.aws|\.gnupg|\.kube|\.docker)[/\\]'
    - '(?i)(^|[/\\])(id_rsa|id_ed25519|id_ecdsa|authorized_keys|shadow)(\s|$)'
    - '(?i)(^|[/\\])(\.npmrc|\.pypirc|\.netrc|\.git-credentials)(\s|$)'
    - '(\.\.[/\\]){2,}'

tests:
  should_block:
    - tool: read_file
      args: { path: "../../.env.production" }
    - tool: fs_read
      args: { file_path: "/home/dev/.ssh/id_rsa" }
    - tool: read_file
      args: { path: "C:\\Users\\dev\\.aws\\credentials" }
    - tool: read_file
      args: { path: "~/.npmrc" }
  should_allow:
    - tool: read_file
      args: { path: "./src/main.rs" }
    - tool: write_file
      args: { path: "docs/environment-setup.md" }
    - tool: read_file
      args: { path: "src/config.example.toml" }
