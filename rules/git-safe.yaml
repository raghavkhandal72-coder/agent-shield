id: git-safe-ops
name: Block Destructive Git Ops & Hook Persistence
severity: high
action: block
description: Prevents history-rewriting git commands and malicious git config persistence vectors.

match:
  tools: ["*git*", "*shell*", "*bash*", "*terminal*", "*exec*", "*cmd*"]
  arg_regex:
    - '(?i)\bgit\s+push\b.*(--force\b|--force-with-lease\b|\s-f(\s|$)|\+HEAD\b|\+main\b|\+master\b)'
    - '(?i)\bgit\s+reset\s+--hard\b'
    - '(?i)\bgit\s+clean\s+-[a-z]*f'
    - '(?i)\bgit\s+branch\s+-D\b'
    - '(?i)\bgit\s+config\b.*(core\.sshCommand|core\.hooksPath|credential\.helper)'

tests:
  should_block:
    - tool: git_run
      args: { command: "git push origin main --force" }
    - tool: run_shell
      args: { cmd: "git push -f origin feature-x" }
    - tool: terminal_exec
      args: { command: "git reset --hard HEAD~3" }
    - tool: git_cli
      args: { command: "git config core.hooksPath /tmp/evil-hooks" }
  should_allow:
    - tool: git_run
      args: { command: "git status -sb" }
    - tool: git_run
      args: { command: "git push origin feature/add-tests" }
    - tool: run_shell
      args: { cmd: "git diff main..HEAD" }
