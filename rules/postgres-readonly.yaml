id: postgres-no-destructive-sql
name: Block Destructive SQL Statements
severity: critical
action: block
description: Prevents AI agents from dropping tables, wiping databases, or running unconstrained deletes.

match:
  tools: ["*query*", "*sql*", "*postgres*", "*sqlite*", "*db*"]
  arg_regex:
    - "(?i)\\b(DROP|TRUNCATE)\\s+(TABLE|DATABASE|SCHEMA)\\b"
    - "(?i)\\bDELETE\\s+FROM\\s+[a-z0-9_]+\\s*(;|$)"

tests:
  should_block:
    - tool: run_sql_query
      args: { query: "DROP TABLE users;" }
    - tool: postgres_query
      args: { sql: "DELETE FROM orders;" }
    - tool: execute_sql
      args: { statement: "TRUNCATE TABLE audit_logs" }
  should_allow:
    - tool: run_sql_query
      args: { query: "SELECT id, email FROM users LIMIT 10;" }
    - tool: postgres_query
      args: { sql: "SELECT count(*) FROM orders WHERE created_at > NOW() - INTERVAL '1 day';" }
