[package]
name = "agent-shield"
version = "0.1.0"
edition = "2021"
description = "Zero-latency local security firewall for MCP servers & AI agents"
authors = ["Raghav <raghav@maximaengineering.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
toml = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
sha2 = "0.10"
hex = "0.4"
similar = "2.6"
base64 = "0.22"
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
